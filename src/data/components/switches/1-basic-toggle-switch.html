<style>.switch{position:relative;display:inline-block;width:42px;height:24px} .switch input{display:none} .slider{position:absolute;inset:0;background:#2a2a2a;border-radius:24px; transition:.25s;cursor:pointer} .slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px; background:#fff;border-radius:50%;transition:.25s} .switch input:checked + .slider{background:#00c8ff} .switch input:checked + .slider::before{transform:translateX(18px)}</style>
<label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
