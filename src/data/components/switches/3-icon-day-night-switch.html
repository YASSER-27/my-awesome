<style>.icon-switch{position:relative;width:56px;height:28px} .icon-switch input{display:none} .islider{position:absolute;inset:0;background:#1c1c1c;border:1px solid #2a2a2a; border-radius:28px;cursor:pointer;display:flex;align-items:center; justify-content:space-between;padding:0 6px;font-size:11px} .islider::before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px; background:#00c8ff;border-radius:50%;transition:.25s;box-shadow:0 0 8px rgba(0,200,255,.6)} .icon-switch input:checked + .islider::before{transform:translateX(26px)}</style>
<label class="icon-switch"><input type="checkbox">
    <span class="islider"><span>&#9728;</span><span>&#9790;</span></span></label>
