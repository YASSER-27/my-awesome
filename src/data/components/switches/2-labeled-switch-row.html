<style>.switch-row{font-family:system-ui,sans-serif;display:flex;align-items:center; justify-content:space-between;background:#151515;border:1px solid #2a2a2a; border-radius:10px;padding:12px 16px;width:260px} .switch-row span{color:#e0e0e0;font-size:12.5px} .switch2{position:relative;width:40px;height:22px} .switch2 input{display:none} .slider2{position:absolute;inset:0;background:#2a2a2a;border-radius:22px;cursor:pointer} .slider2::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px; background:#fff;border-radius:50%;transition:.2s} .switch2 input:checked + .slider2{background:#00c8ff} .switch2 input:checked + .slider2::before{transform:translateX(18px)}</style>
<div class="switch-row"><span>Push Notifications</span>
    <label class="switch2"><input type="checkbox" checked><span class="slider2"></span></label></div>
