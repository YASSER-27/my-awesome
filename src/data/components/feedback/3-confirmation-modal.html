<style>.modal{font-family:system-ui,sans-serif;background:#151515;border:1px solid #2a2a2a; border-radius:14px;padding:22px;width:300px;box-shadow:0 10px 40px rgba(0,0,0,.5)} .modal h3{margin:0 0 8px;color:#e0e0e0;font-size:15px} .modal p{margin:0 0 18px;color:#888;font-size:12px;line-height:1.5} .modal .actions{display:flex;gap:8px;justify-content:flex-end} .modal button{padding:8px 16px;border-radius:7px;font-size:12px;font-weight:600; cursor:pointer;border:none} .modal .cancel{background:#1c1c1c;color:#888} .modal .confirm{background:#ff4d5e;color:#fff}</style>
