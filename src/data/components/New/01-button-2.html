<style>.wrap{display:flex;flex-wrap:wrap;gap:10px;padding:8px;font-family:system-ui,sans-serif}.btn{padding:9px 20px;border:none;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.2s}.blue{background:#3a7bd5;color:#fff}.green{background:#1fa463;color:#fff}.gray{background:#5a5f6b;color:#fff}.orange{background:#e8a33d;color:#1a1a1a}.red{background:#d9534f;color:#fff}.spin{width:11px;height:11px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}</style>
<div class="wrap"><button class="btn blue"><span class="spin"></span>Blue</button><button class="btn green"><span class="spin"></span>Green</button><button class="btn gray"><span class="spin"></span>Gray</button><button class="btn orange"><span class="spin" style="border-color:rgba(0,0,0,.25);border-top-color:#1a1a1a"></span>Orange</button><button class="btn red"><span class="spin"></span>Red</button></div>
