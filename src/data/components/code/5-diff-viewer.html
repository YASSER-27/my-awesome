<style>.diff-block{font-family:'Courier New',monospace;font-size:12px;width:100%; max-width:420px;background:#0e0e0e;border:1px solid #2a2a2a;border-radius:10px; overflow:hidden;line-height:1.8} .diff-block .line{padding:2px 14px} .diff-block .add{background:rgba(46,204,113,.12);color:#2ecc71} .diff-block .rem{background:rgba(255,77,94,.12);color:#ff4d5e;text-decoration:line-through} .diff-block .ctx{color:#666}</style>
<div class="diff-block">
    <div class="line ctx">function total(items) {</div>
    <div class="line rem">- return items.length</div>
    <div class="line add">+ return items.reduce((a,b)=&gt;a+b.price,0)</div>
    <div class="line ctx">}</div></div>
